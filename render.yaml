# Blueprint for manual staging deployment. This file alone does not create services.
# Do not provision until all four SQL migrations have been applied and every required secret is set.
services:
  - type: web
    name: vine-accounts-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:accounts
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SUPABASE_URL
        value: https://jktuwbgocpixtelfxzwq.supabase.co
      - key: AUTH_SUPABASE_ANON_KEY
        sync: false
      - key: ACCOUNTS_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VINE_OWNER_EMAIL
        value: donchester111@gmail.com
      - key: VINE_OWNER_USER_ID
        sync: false
      - key: OWNER_SESSION_SECRET
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: VINE_STAFF_INVITE_REDIRECT_URL
        value: https://vinestore.com.ng/vineger.html
      - key: RESEND_API_KEY
        sync: false
      - key: VINE_EMAIL_FROM
        sync: false
      - key: GMAIL_SENDER_EMAIL
        value: vinestore1official@gmail.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://accounts-api.donchester111.workers.dev/api/v1/email/google/callback
      - key: ALLOWED_ORIGINS
        sync: false

