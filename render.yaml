      - key: PRODUCTS_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ORDERS_SUPABASE_URL
        value: https://ybwdecxsbveiobfvwkvr.supabase.co
      - key: ORDERS_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPERATIONS_SUPABASE_URL
        value: https://sqtntfnbjtguqddvvsly.supabase.co
      - key: OPERATIONS_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PAYSTACK_SECRET_KEY
